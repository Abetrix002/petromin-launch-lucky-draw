<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: 1920×1080 stage scaled to fit. The wheel's pointer faces the announcement panel, so the winning slice reads straight into the result. */
:root {
  color-scheme: dark;
  --ink: #170A0E; --ink-2: #210D14; --ink-3: #2A1017; --red: #CE0E2D; --gold: #E6B103; --gold-pale: #F5E6A3;
  --white: #FFFFFF; --line-gold: #F5E6A3; --text-2: #E2D3D6; --dark-text: #252525;
  --display: "Space Grotesk", "Noto Sans Arabic", system-ui, sans-serif;
  --ui: Inter, "Noto Sans Arabic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: #0D0508; overflow: hidden; color: var(--white); font: 400 32px/1.4 var(--ui); padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
#stage { position: absolute; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
  background: radial-gradient(1100px 900px at var(--bloom, 30%) 50%, rgba(206,14,45,.38), transparent 72%), linear-gradient(90deg, var(--ink), var(--ink-2) 52%, var(--ink)); }
[dir=rtl] #stage { --bloom: 70%; }
:lang(ar) h1, :lang(ar) .pill, :lang(ar) .giant { letter-spacing: 0; }

.pill { display: inline-flex; align-items: center; gap: 12px; padding: 12px 26px; border-radius: 999px; font: 700 28px var(--ui); letter-spacing: .05em; text-transform: uppercase; color: var(--ink); background: linear-gradient(90deg, var(--gold-pale), var(--gold)); align-self: flex-start; }
.pill svg { width: 28px; height: 28px; fill: currentColor; }
h1 { margin: 0; font: 300 92px/1.1 var(--display); letter-spacing: .5px; text-wrap: balance; }
h1 b { font-weight: 700; }
.sub { margin: 0; font-size: 38px; color: var(--text-2); }
.btn { align-self: flex-start; min-height: 96px; padding: 0 56px; border: 0; border-radius: 999px; background: linear-gradient(90deg, var(--gold-pale), var(--gold)); color: var(--ink); font: 700 38px var(--ui); cursor: pointer; }
.btn.sec { background: rgba(255,255,255,.12); color: var(--white); box-shadow: inset 0 0 0 2px rgba(255,255,255,.4); }
.btn:focus-visible { outline: 5px solid var(--white); outline-offset: 4px; }
.row { display: flex; gap: 24px; flex-wrap: wrap; }

/* Wheel layout */
#draw { position: absolute; inset: 0; display: flex; align-items: center; gap: 50px; padding-inline: 60px 80px; }
#wheel { width: 1000px; height: 1000px; flex: none; }
#wheel .sl { transition: opacity .45s; }
#wheel.landed .sl:not(.hit) { opacity: .3; }
#wheel.landed .hit .face { filter: brightness(1.12); }
.bulb { fill: #FFF3C4; }
#wheel.spinning .bulb { animation: blink .5s steps(2) infinite; }
#wheel.spinning .bulb:nth-child(even) { animation-delay: .25s; }
@keyframes blink { 50% { fill: #7A4A00; } }
#panel { flex: 1; min-width: 0; height: 960px; display: flex; flex-direction: column; justify-content: center; gap: 34px; position: relative; }
.logo { position: absolute; top: 0; inset-inline-end: 0; height: 150px; }
.giant { font: 700 250px/1 var(--display); color: var(--gold-pale); font-variant-numeric: tabular-nums; }
.prize-hero { display: flex; flex-direction: column; gap: 28px; align-items: flex-start; }
.disc { width: 300px; height: 300px; flex: none; display: grid; place-items: center; background: #fff; border: 5px solid var(--line-gold); border-radius: 28px; }
.disc img { width: 240px; height: 240px; object-fit: contain; }
.pname { font: 700 104px/1.05 var(--display); max-width: 100%; }
.winner-name { font: 700 132px/1.08 var(--display); white-space: nowrap; }
.tail { font: 500 66px/1 var(--ui); color: var(--gold-pale); font-variant-numeric: tabular-nums; }
.wins { display: flex; align-items: center; gap: 22px; font: 500 44px var(--ui); }
.wins img { width: 92px; height: 92px; object-fit: contain; background: #fff; border-radius: 16px; padding: 8px; }
.reel { height: 450px; overflow: hidden; -webkit-mask: linear-gradient(transparent, #000 34%, #000 66%, transparent); mask: linear-gradient(transparent, #000 34%, #000 66%, transparent); }
.rail { will-change: transform; }
.rail div { height: 150px; display: flex; align-items: center; gap: 28px; font: 700 96px/1 var(--display); white-space: nowrap; }
.rail bdi { font: 500 54px var(--ui); color: var(--gold-pale); }
.won { position: absolute; bottom: 0; inset-inline: 0; }
.won h2 { margin: 0 0 12px; font: 600 26px var(--ui); color: var(--text-2); }
.won div.list { display: flex; gap: 14px; overflow: hidden; }
.chip { display: flex; align-items: center; gap: 12px; padding: 8px 20px 8px 8px; border-radius: 999px; background: rgba(255,255,255,.1); font: 600 28px var(--ui); white-space: nowrap; }
[dir=rtl] .chip { padding: 8px 8px 8px 20px; }
.chip img { width: 52px; height: 52px; object-fit: contain; background: #fff; border-radius: 50%; padding: 5px; }

/* Join and final layouts */
.full { position: absolute; inset: 0; padding: 60px 80px; display: flex; flex-direction: column; }
.j-top { flex: 1; display: grid; grid-template-columns: 1fr 640px; grid-template-rows: minmax(0, 1fr); gap: 70px; min-height: 0; }
.j-l { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.j-h { display: flex; align-items: center; gap: 32px; }
.j-h .pill { align-self: center; }
.j-l .logo { position: static; height: 130px; }
.j-l .sub { font-size: 34px; }
.j-l h1 { font-size: 100px; }
.count { display: flex; align-items: flex-end; gap: 28px; margin-top: auto; }
.count .giant { font-size: 150px; }
.count p { margin: 0; font-size: 38px; }
.count .meta { display: grid; gap: 4px; padding-bottom: 14px; min-width: 0; }
.count .end { margin-inline-start: auto; margin-bottom: 18px; }
.count .btn { min-height: 72px; padding: 0 36px; font-size: 28px; }
.count p.latest { color: var(--gold-pale); font: 500 30px var(--ui); white-space: nowrap; }
.qr { background: #fff; color: var(--ink); border-radius: 36px; padding: 30px; display: grid; justify-items: center; align-content: center; gap: 18px; border: 6px solid var(--line-gold); }
.qr svg { width: 520px; height: 520px; display: block; }
.qr b { font: 700 52px var(--display); }
.strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 18px; height: 190px; margin-top: 34px; }
.pz { background: #fff; color: var(--dark-text); border: 2px solid var(--line-gold); border-radius: 20px; display: grid; grid-template-rows: 1fr auto; justify-items: center; padding: 14px 10px; font: 700 28px/1.1 var(--display); min-width: 0; }
.pz img { height: 116px; max-width: 100%; object-fit: contain; }
.final { align-items: center; text-align: center; gap: 36px; justify-content: center; }
.final .logo { position: static; height: 130px; }
.final .pill { align-self: center; }
.wgrid { display: flex; flex-wrap: wrap; justify-content: center; gap: 22px; }
.wcard { width: 400px; background: #fff; color: var(--dark-text); border-radius: 24px; padding: 20px; display: flex; align-items: center; gap: 18px; text-align: start; }
.wcard img { width: 100px; height: 100px; object-fit: contain; flex: none; }
.wcard b { display: block; font: 700 36px/1.15 var(--display); }
.wcard span { font: 500 26px var(--ui); color: #6B585A; }
.foot { margin: 0; font-size: 36px; color: var(--text-2); }

#lost { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(13,5,8,.95); }
#lost div { display: grid; gap: 28px; justify-items: center; text-align: center; max-width: 1200px; }
canvas { position: absolute; inset: 0; pointer-events: none; z-index: 4; }

.rv { position: fixed; z-index: 20; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); direction: ltr; font: 500 13px Inter, system-ui, sans-serif; background: #fff; color: #252525; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
.rv summary { padding: 10px 14px; cursor: pointer; font-weight: 600; }
.rv div { display: grid; padding: 0 8px 8px; width: 220px; max-height: 70vh; overflow: auto; }
.rv button { text-align: left; min-height: 30px; padding: 0 8px; border: 0; border-radius: 8px; background: none; font: inherit; color: inherit; cursor: pointer; }
.rv button[aria-current=true] { background: #FCE8EB; color: #A50A23; font-weight: 700; }
.rv small { padding: 6px 8px 0; color: #6B585A; }
.rv a { padding: 6px 8px; color: #A50A23; font-weight: 700; }
</style>

<script>

  { id: "drill", qty: 1, en: "Cordless drill", ar: "دريل لاسلكي" }, { id: "giftcard", qty: 2, en: "Gift card", ar: "بطاقة هدايا" },
  { id: "watch", qty: 1, en: "Smart watch", ar: "ساعة ذكية" }, { id: "suitcase", qty: 1, en: "Suitcase", ar: "حقيبة سفر" },

const F = [["أحمد","Ahmed"],["محمد","Mohammed"],["خالد","Khalid"],["عبد الله","Abdullah"],["سعيد","Saeed"],["ياسر","Yasser"],["فهد","Fahad"],["ماجد","Majed"],["عمر","Omar"],["يوسف","Yousef"],["إبراهيم","Ibrahim"],["علي","Ali"],["حسن","Hassan"],["طارق","Tariq"],["ناصر","Nasser"],["سلطان","Sultan"],["وليد","Waleed"],["مصطفى","Mostafa"],["سامي","Sami"],["رامي","Rami"]];

const ENTRIES = Array.from({ length: 248 }, (_, i) => { const f = F[i % F.length], l = L[(i * 7 + (i >> 2)) % L.length]; return { id: i, ar: f[0] + " " + l[0], en: f[1] + " " + l[1], phone: "5" + String((i * 48271 + 10000019) % 100000000).padStart(8, "0") }; });

const T = {
  en: { eb: "Launch event lucky draw", joinH: "Scan to enter <b>the lucky draw.</b>", joinSub: "Open your camera, scan the code, and add your name and mobile.", scan: "Scan to enter", countL: "entries so far", latest: n => "Just joined: " + n, empty: "Be the first to enter.", closeBtn: "Close entries",

    spinH: "The wheel <b>is spinning.</b>", spinS: "Good luck, everyone.", landE: "This round's prize", drawBtn: "Draw the winner", reelH: "Who wins <b>this prize?</b>",
    winE: "Winner", stage: "Please come to the stage", wins: "Wins", awardBtn: "Prize handed over", skipBtn: "Not in the hall, redraw",

    doneE: "Draw complete", doneH: "Congratulations to <b>all our winners.</b>", doneF: "Not a Super Star yet? Find out more at superstars.petrolubegroup.com",
    noneE: "Draw paused", noneH: "No entries <b>left to draw.</b>", noneS: p => `Everyone in the draw has won a prize or was not in the hall. Still to give away: ${p}.`, reopenBtn: "Reopen entries",
    lostH: "Connection <b>lost.</b>", lostS: "The draw is paused. All entries and winners are saved.", lostBtn: "Reconnect" },
  ar: { eb: "سحب حفل الإطلاق", joinH: "امسح الرمز <b>وادخل السحب.</b>", joinSub: "افتح كاميرا جوالك، امسح الرمز، واكتب اسمك ورقم جوالك.", scan: "امسح للتسجيل", countL: "مشارك حتى الآن", latest: n => "انضم الآن: " + n, empty: "كن أول المشاركين.", closeBtn: "أغلق التسجيل",
    closedE: "انتهى التسجيل", closedL: "مشارك في السحب", closedS: n => `عدد الجوائز: ${n}. يتم اختيار كل فائز عشوائيًا.`, startBtn: "ابدأ السحب",
    prizeOf: (i, t) => `الجائزة ${i} من ${t}`, readyH: "أدر العجلة <b>لتكشف الجائزة.</b>", readyS: n => `عدد المشاركين في السحب: ${n}`, spinBtn: "أدر العجلة", lastH: "بقيت جائزة واحدة.<br><b>السحب الأخير.</b>", lastBtn: "اكشف الجائزة الأخيرة",
    spinH: "العجلة <b>تدور الآن.</b>", spinS: "بالتوفيق للجميع.", landE: "جائزة هذه الجولة", drawBtn: "اسحب اسم الفائز", reelH: "من سيفوز <b>بهذه الجائزة؟</b>",
    winE: "الفائز", stage: "تفضل إلى المسرح", wins: "الجائزة", awardBtn: "تم تسليم الجائزة", skipBtn: "غير موجود، اسحب من جديد",
    redrawH: "لا يوجد رد.<br><b>نسحب من جديد.</b>", redrawS: "الجائزة ما زالت متاحة، والاسم السابق خرج من السحب.", againBtn: "اسحب من جديد", rail: "الفائزون حتى الآن",
    doneE: "انتهى السحب", doneH: "مبروك <b>لكل الفائزين.</b>", doneF: "لم تنضم إلى سوبر ستارز بعد؟ اعرف المزيد على superstars.petrolubegroup.com",
    noneE: "السحب متوقف", noneH: "لا توجد <b>أسماء متبقية.</b>", noneS: p => `كل المشاركين إما فازوا أو لم يكونوا في القاعة. جائزة لم تُسلَّم بعد: ${p}.`, reopenBtn: "أعد فتح التسجيل",
    lostH: "انقطع <b>الاتصال.</b>", lostS: "السحب متوقف مؤقتًا. كل المشاركات والفائزين محفوظون.", lostBtn: "أعد الاتصال" },
};
const STATES = [["join","Join"],["join-empty","Join, no entries"],["closed","Entries closed"],["ready","Ready to spin"],["spinning","Spinning"],["landed","Prize landed"],["reel","Name reel"],["winner","Winner"],["redraw","Not present, redraw"],["next","Next round"],["complete","Draw complete"],["none-left","No entries left"],["lost","Connection lost"]];

const $ = id => document.getElementById(id), view = $("view");
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const R0 = 480, RIM = 462, RS = 444;
let lang = "ar", state = "join", D, joined = 236, rot = 0, lost = false, busy = false, timer, raf;
const rtl = () => lang === "ar", t = () => T[lang];
const pn = p => p[lang], who = e => Draw.publicName(e[lang]), tail = e => "••••" + Draw.lastFour(e.phone);
const img = p => `assets/${p.id}.png`, fmt = n => n.toLocaleString("en");
const pick = a => a[Math.floor(Math.random() * a.length)];
const fresh = () => createNew(ENTRIES.slice(0, joined));
const createNew = list => (D = Draw.createDraw(list, PRIZES));

function fit() { const s = $("stage"), k = Math.min(innerWidth / 1920, innerHeight / 1080); s.style.transform = `scale(${k})`; s.style.left = (innerWidth - 1920 * k) / 2 + "px"; s.style.top = (innerHeight - 1080 * k) / 2 + "px"; }
addEventListener("resize", fit); fit();

/* Wheel. Each slice's content is upright when that slice is at the pointer (3 o'clock in English, 9 o'clock in Arabic). */
function wheelSVG() {
  const s = D.slices(), n = s.length, step = 360 / n, dir = rtl() ? -1 : 1, a = step / 2 * Math.PI / 180;
  const x = RS * Math.cos(a) * dir, y = RS * Math.sin(a);
  const sweep = dir > 0 ? 1 : 0;
  const slices = s.map((p, i) => {
    const fill = n % 2 && i === n - 1 ? "#A50A23" : i % 2 ? "#2A1017" : "#CE0E2D";
    const shape = n === 1 ? `<circle r="${RS}" fill="${fill}"/>` : `<path d="M0 0 L${x} ${-y} A${RS} ${RS} 0 ${step > 180 ? 1 : 0} ${sweep} ${x} ${y} Z" fill="${fill}" stroke="#E6B103" stroke-width="3"/>`;
    const words = pn(p).split(" "), lines = words.length > 1 ? [words.slice(0, -1).join(" "), words[words.length - 1]] : words;
    const size = Math.min(29, Math.floor(132 / (Math.max(...lines.map(l => l.length)) * .56)));
    const label = lines.map((w, l) => `<tspan x="${dir * 174}" dy="${l ? 32 : (lines.length > 1 ? -12 : 10)}">${w}</tspan>`).join("");
    return `<g class="sl${D.prize === p ? " hit" : ""}" transform="rotate(${i * step})"><g class="face">${shape}
      <text text-anchor="middle" fill="#fff" font-family="Space Grotesk, Noto Sans Arabic, sans-serif" font-weight="700" font-size="${size}">${label}</text>
      <circle cx="${dir * 335}" r="86" fill="#fff" stroke="#F5E6A3" stroke-width="4"/>
      <image href="${img(p)}" x="${dir * 335 - 62}" y="-62" width="124" height="124" preserveAspectRatio="xMidYMid meet"/></g></g>`;
  }).join("");
  const bulbs = Array.from({ length: 40 }, (_, i) => { const b = i * 9 * Math.PI / 180; return `<circle class="bulb" cx="${RIM * Math.cos(b)}" cy="${RIM * Math.sin(b)}" r="7"/>`; }).join("");
  const pointer = `<g transform="scale(${dir} 1)"><g id="ptr" style="transform-box:view-box;transform-origin:512px 0"><path d="M430 0 L512 -38 Q524 0 512 38 Z" fill="url(#g)" stroke="#170A0E" stroke-width="5"/></g></g>`;
  return `<svg id="wheel" class="${state === "spinning" ? "spinning" : ""}${["landed","reel","winner","redraw"].includes(state) ? " landed" : ""}" viewBox="-520 -520 1040 1040" role="img" aria-label="${t().eb}">
    <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#F5E6A3"/><stop offset="1" stop-color="#E6B103"/></linearGradient></defs>
    <circle r="${R0}" fill="#170A0E"/><circle r="${RIM}" fill="none" stroke="url(#g)" stroke-width="36"/>
    <g id="rot" transform="rotate(${rot})">${slices}</g>
    <g>${bulbs}</g>
    <circle r="96" fill="#170A0E" stroke="url(#g)" stroke-width="8"/><image href="assets/logo.png" x="-74" y="-69" width="148" height="138"/>
    ${pointer}</svg>`;
}
const setRot = r => { rot = r; const g = $("rot"); if (g) g.setAttribute("transform", `rotate(${r})`); };
const landOn = p => { const s = D.slices(); setRot(-s.indexOf(p) * 360 / s.length); };
const mod = (a, n) => ((a % n) + n) % n;

function spin(done) {
  const s = D.slices(), step = 360 / s.length, k = s.indexOf(D.prize);
  const from = rot, to = rot + 360 * 7 + mod(-k * step + (Math.random() - .5) * (step - 14) - rot, 360);
  if (calm) { setRot(to); return done(); }
  const t0 = performance.now(), ms = 7000; let last = Math.floor(from / step);
  (function frame(now) {
    const p = Math.min(1, (now - t0) / ms), r = from + (to - from) * (1 - (1 - p) ** 4);
    setRot(r);
    const b = Math.floor((r + step / 2) / step);
    if (b !== last) { last = b; $("ptr")?.animate([{ transform: "rotate(16deg)" }, { transform: "rotate(0)" }], { duration: 130 }); }
    if (p < 1) raf = requestAnimationFrame(frame); else done();
  })(t0);
}

const logo = `<img class="logo" src="assets/logo.png" alt="Super Stars">`;
const pill = (x, star = true) => `<span class="pill">${star ? STAR : ""}${x}</span>`;
const btn = (x, act, sec) => `<button class="btn${sec ? " sec" : ""}" data-act="${act}" type="button">${x}</button>`;
const rail = () => { const w = D.winners.slice(-3); return w.length ? `<div class="won"><h2>${t().rail}</h2><div class="list">${w.map(x => `<span class="chip"><img src="${img(x.prize)}" alt="">${who(x.entry)}</span>`).join("")}</div></div>` : ""; };
const roundNo = () => D.winners.length + 1;
const prizeHero = p => `<div class="prize-hero"><div class="disc"><img src="${img(p)}" alt=""></div><div class="pname">${pn(p)}</div></div>`;

function panel() {
  const T = t(), P = D.prize, n = D.pool().length;
  switch (state) {
    case "closed": return `${pill(T.closedE)}<div class="giant">${fmt(n)}</div><h1 style="font-size:64px">${T.closedL}</h1><p class="sub">${T.closedS(D.total)}</p>${btn(T.startBtn, "ready")}`;
    case "ready": case "next": { const last = D.slices().length === 1; return `${pill(T.prizeOf(roundNo(), D.total))}<h1>${last ? T.lastH : T.readyH}</h1><p class="sub">${T.readyS(fmt(n))}</p>${btn(last ? T.lastBtn : T.spinBtn, "spin")}`; }
    case "spinning": return `${pill(T.prizeOf(roundNo(), D.total))}<h1>${T.spinH}</h1><p class="sub">${T.spinS}</p>`;
    case "landed": return `${pill(T.landE)}${prizeHero(P)}${btn(T.drawBtn, "reel")}`;
    case "reel": return `${pill(pn(P))}<h1 style="font-size:76px">${T.reelH}</h1><div class="reel"><div class="rail" id="rail"></div></div>`;
    case "winner": return `${pill(T.winE)}<div class="winner-name" id="wn">${who(D.entry)}</div><bdi class="tail" dir="ltr">${tail(D.entry)}</bdi><p class="sub" style="font-size:52px;color:#fff;font-weight:600">${T.stage}</p><div class="wins"><img src="${img(P)}" alt="">${T.wins}: ${pn(P)}</div><div class="row">${btn(T.awardBtn, "award")}${btn(T.skipBtn, "skip", 1)}</div>`;
    case "redraw": return `${pill(pn(P))}<h1>${T.redrawH}</h1><p class="sub">${T.redrawS}</p>${btn(T.againBtn, "reel")}`;
    case "none-left": return `${pill(T.noneE, false)}<h1>${T.noneH}</h1><p class="sub">${T.noneS(pn(P))}</p>${btn(T.reopenBtn, "join")}`;
  }
}

function joinView() {
  const T = t(), qr = window.qrcode ? qrcode(0, "M") : null;
  if (qr) { qr.addData(LANDING_URL); qr.make(); }
  const latest = joined ? who(ENTRIES[joined - 1]) : "";
  return `<div class="full"><div class="j-top"><div class="j-l"><div class="j-h">${logo}${pill(T.eb)}</div><h1>${T.joinH}</h1><p class="sub">${T.joinSub}</p>
      <div class="count"><div class="giant" id="cnt">${fmt(joined)}</div><div class="meta"><p>${T.countL}</p><p class="latest" id="lat">${joined ? T.latest(latest) : T.empty}</p></div><span class="end">${btn(T.closeBtn, "closed", 1)}</span></div></div>
    <div class="qr">${qr ? qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true }) : ""}<b>${T.scan}</b></div></div>
    <div class="strip">${PRIZES.map(p => `<div class="pz"><img src="${img(p)}" alt=""><span>${pn(p)}</span></div>`).join("")}</div></div>`;
}
function finalView() {
  const T = t();
  return `<div class="full final">${logo}${pill(T.doneE)}<h1>${T.doneH}</h1><div class="wgrid">${D.winners.map(w => `<div class="wcard"><img src="${img(w.prize)}" alt=""><div><b>${who(w.entry)}</b><span>${pn(w.prize)}</span></div></div>`).join("")}</div><p class="foot">${T.doneF}</p></div>`;
}

function render() {
  const root = document.documentElement; root.lang = lang; root.dir = rtl() ? "rtl" : "ltr";
  clearInterval(timer); cancelAnimationFrame(raf);
  if (state === "join" || state === "join-empty") {
    view.innerHTML = joinView();
    if (state === "join" && !lost) timer = setInterval(tickJoin, 2600);
  } else if (state === "complete") view.innerHTML = finalView();
  else view.innerHTML = `<div id="draw">${wheelSVG()}<div id="panel" aria-live="polite">${logo}${panel()}${["ready","next","spinning"].includes(state) ? rail() : ""}</div></div>`;
  if (lost) view.insertAdjacentHTML("beforeend", `<div id="lost"><div><h1>${t().lostH}</h1><p class="sub">${t().lostS}</p>${btn(t().lostBtn, "reconnect")}</div></div>`);
  const wn = $("wn"); if (wn) { const box = wn.parentElement.clientWidth; let f = 132; while (wn.scrollWidth > box && f > 60) wn.style.fontSize = (f -= 6) + "px"; }
  document.querySelectorAll("#rv button").forEach(b => b.setAttribute("aria-current", b.dataset.s ? (b.dataset.s === "lost" ? lost : !lost && b.dataset.s === state) : b.dataset.l === lang));
  try { history.replaceState(null, "", "#" + lang + "-" + (lost ? "lost" : state)); } catch {}
}
function tickJoin() {
  if (joined >= ENTRIES.length) return clearInterval(timer);
  joined++; $("cnt").textContent = fmt(joined); $("lat").textContent = t().latest(who(ENTRIES[joined - 1]));
}

function runSpin() {
  D.spin(); state = "spinning"; busy = true; render();
  const done = () => { busy = false; state = "landed"; render(); };
  D.slices().length === 1 ? done() : spin(done);
}
function runReel() {
  const e = D.pickWinner();
  if (!e) { state = "none-left"; D.entry = null; return render(); }
  state = "reel"; busy = true; render();
  const pool = D.pool(), seq = Array.from({ length: 40 }, () => pick(pool)).concat(e, pick(pool));
  $("rail").innerHTML = seq.map(x => `<div>${who(x)} <bdi dir="ltr">${tail(x)}</bdi></div>`).join("");
  const end = -(seq.length - 3) * 150;
  const finish = () => { busy = false; state = "winner"; render(); confetti(); };
  if (calm) { $("rail").style.transform = `translateY(${end}px)`; return finish(); }
  $("rail").animate([{ transform: "translateY(0)" }, { transform: `translateY(${end}px)` }], { duration: 4800, easing: "cubic-bezier(.12,.72,.14,1)", fill: "forwards" }).onfinish = finish;
}
const act = {
  closed() { fresh(); state = "closed"; render(); },
  ready() { state = "ready"; render(); },
  spin: runSpin, reel: runReel,
  award() { D.award(); rot = 0; state = D.slices().length ? "next" : "complete"; render(); if (state === "complete") confetti(); },
  skip() { D.skip(); state = "redraw"; render(); },
  join() { joined = ENTRIES.length; state = "join"; render(); },
  reconnect() { lost = false; render(); },
};
view.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b && !busy) act[b.dataset.act](); });
addEventListener("keydown", e => {
  if (e.code !== "Space" && e.key !== "Enter" || busy || e.target.closest?.(".rv")) return;
  e.preventDefault();
  if (lost) return act.reconnect();
  if (state === "join" || state === "join-empty") return act.closed();
  view.querySelector("[data-act]")?.click();
});

function confetti() {
  if (calm) return;
  const c = $("fx"), x = c.getContext("2d"), cols = ["#F5E6A3", "#E6B103", "#CE0E2D", "#FF8300", "#FFFFFF"];
  const ps = Array.from({ length: 170 }, () => ({ x: Math.random() * 1920, y: -40 - Math.random() * 500, v: 7 + Math.random() * 9, s: 9 + Math.random() * 13, r: Math.random() * 6, w: (Math.random() - .5) * .25, c: pick(cols) }));
  const t0 = performance.now();
  (function f(now) {
    x.clearRect(0, 0, 1920, 1080);
    ps.forEach(p => { p.y += p.v; p.r += p.w; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.beginPath(); for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5, q = i % 2 ? p.s * .45 : p.s; x.lineTo(Math.sin(a) * q, -Math.cos(a) * q); } x.fill(); x.restore(); });
    if (now - t0 < 3600) requestAnimationFrame(f); else x.clearRect(0, 0, 1920, 1080);
  })(t0);
}

// Reviewer jump: builds the draw into the right shape for each state.
function go(s) {
  cancelAnimationFrame(raf); busy = false; lost = false; rot = 0; $("fx").getContext("2d").clearRect(0, 0, 1920, 1080);
  joined = ENTRIES.length; fresh();
  const land = () => { D.spin(); landOn(D.prize); };
  const award = k => { for (let i = 0; i < k; i++) { D.spin(); D.pickWinner(); D.award(); } };
  if (s === "lost") { lost = true; state = "ready"; return render(); }
  state = s;
  if (s === "join") joined = 236;
  if (s === "join-empty") joined = 0;
  if (s === "spinning") { state = "ready"; render(); return runSpin(); }
  if (s === "landed") land();
  if (s === "reel") { land(); state = "landed"; render(); return runReel(); }
  if (s === "winner") { land(); D.pickWinner(); }
  if (s === "redraw") { land(); D.pickWinner(); D.skip(); }
  if (s === "next") award(2);
  if (s === "complete") award(D.total);
  if (s === "none-left") { createNew(ENTRIES.slice(0, 1)); land(); D.pickWinner(); D.skip(); D.entry = null; }
  render();
  if (s === "winner") confetti();
}
$("rv").innerHTML = [["ar","Arabic"],["en","English"]].map(l => `<button type="button" data-l="${l[0]}">${l[1]}</button>`).join("") + STATES.map(s => `<button type="button" data-s="${s[0]}">${s[1]}</button>`).join("") + `<a href="${LANDING_URL}" target="_blank" rel="noopener">Open landing page</a><small>Sample names and prizes. Space runs the next step.</small>`;
$("rv").addEventListener("click", e => { const b = e.target.closest("button"); if (!b || busy && b.dataset.l) return; if (b.dataset.l) { lang = b.dataset.l; render(); } else go(b.dataset.s); });
const m = location.hash.match(/^#(ar|en)-([a-z-]+)$/);
if (m) lang = m[1];
go(m && STATES.some(s => s[0] === m[2]) ? m[2] : "join");
</script>
