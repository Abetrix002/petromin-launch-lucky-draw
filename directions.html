<title>Super Stars Draw Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Layout: reviewer bar on top, a 1920×1080 stage scaled into the rest. Each direction mounts its own scene into the stage. */
:root {
  color-scheme: dark;
  --ink: #170A0E; --ink-2: #210D14; --red: #CE0E2D; --gold: #E6B103; --gold-pale: #F5E6A3;
  --white: #FFFFFF; --text-2: #E2D3D6;
  --display: "Space Grotesk", "Noto Sans Arabic", system-ui, sans-serif;
  --ui: Inter, "Noto Sans Arabic", system-ui, sans-serif;
  --mono: "JetBrains Mono", "Noto Sans Arabic", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #0D0508; color: var(--white); overflow: hidden; font: 400 15px/1.4 Inter, system-ui, sans-serif; }

.ctl { position: fixed; z-index: 10; top: 0; left: 0; right: 0; min-height: 64px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; direction: ltr;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: #FBF7F4; color: #1E1316; border-bottom: 1px solid #EADBD3; }
.seg { display: inline-flex; background: #F1E9E5; border-radius: 12px; padding: 3px; }
.seg button { min-height: 38px; padding: 0 14px; border: 0; border-radius: 9px; background: none; color: #1E1316; font: 600 14px Inter, sans-serif; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed=true] { background: #1E1316; color: #FBF7F4; }
.go { min-height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: linear-gradient(90deg, #F5E6A3, #E6B103); color: #170A0E; font: 700 15px Inter, sans-serif; cursor: pointer; }
.go:disabled { opacity: .45; cursor: progress; }
.ghost { min-height: 40px; padding: 0 14px; border: 1px solid #D9C6BD; border-radius: 999px; background: #fff; color: #1E1316; font: 600 14px Inter, sans-serif; cursor: pointer; }
.hint { flex: 1 1 260px; min-width: 0; font-size: 13px; color: #6B585A; }
.ctl button:focus-visible { outline: 3px solid #A50A23; outline-offset: 2px; }

#stage { position: absolute; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; font: 400 32px/1.3 var(--ui);
  background: radial-gradient(1200px 780px at 50% 50%, rgba(206,14,45,.4), transparent 72%), linear-gradient(90deg, var(--ink), var(--ink-2) 52%, var(--ink)); }
#stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .9s;
  background: radial-gradient(900px 620px at 50% 52%, rgba(245,200,60,.55), rgba(230,177,3,.12) 55%, transparent 75%); }
#stage.tell::after { opacity: 1; }
:lang(ar) #stage { letter-spacing: 0; }
.bar { position: absolute; z-index: 3; top: 40px; inset-inline: 80px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
.bar img { height: 110px; }
.tally { font: 500 34px var(--ui); color: var(--text-2); }
.tally b { font: 700 60px var(--display); color: var(--gold-pale); margin-inline-end: 12px; font-variant-numeric: tabular-nums; }
#scene { position: absolute; inset: 0; }
canvas { position: absolute; inset: 0; pointer-events: none; z-index: 6; }

/* Shared winner card */
#win { position: absolute; z-index: 5; left: 50%; top: 52%; width: 1500px; padding: 60px 80px; transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none; text-align: center;
  border-radius: 56px; background: radial-gradient(800px 300px at 50% 0%, rgba(245,230,163,.18), transparent 70%), #1C0C11; box-shadow: 0 0 0 6px var(--gold), 0 0 120px rgba(230,177,3,.45); transition: transform .7s cubic-bezier(.2,1.4,.3,1), opacity .4s; }
#win.on { transform: translate(-50%, -50%) scale(1); opacity: 1; }
.pill { display: inline-flex; align-items: center; gap: 12px; padding: 12px 26px; border-radius: 999px; font: 700 28px var(--ui); letter-spacing: .05em; text-transform: uppercase; color: var(--ink); background: linear-gradient(90deg, var(--gold-pale), var(--gold)); }
:lang(ar) .pill { letter-spacing: 0; }
.pill svg { width: 28px; height: 28px; fill: currentColor; }
.wname { font: 700 170px/1.1 var(--display); white-space: nowrap; margin-top: 18px; }
.wtail { font: 500 58px/1 var(--ui); color: var(--gold-pale); font-variant-numeric: tabular-nums; }
.wcall { font: 600 54px var(--ui); margin-top: 22px; }

/* 1 · Constellation */
.cst { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 50% 54%; }
.sph { position: absolute; left: 50%; top: 54%; width: 0; height: 0; transform-style: preserve-3d; transition: transform 1s cubic-bezier(.5,0,.2,1), opacity .8s; }
.sph.gone { opacity: 0; }
.chip { position: absolute; left: 0; top: 0; padding: 8px 18px; border-radius: 999px; white-space: nowrap; font: 600 24px var(--ui); color: var(--gold-pale);
  background: rgba(40,14,22,.78); box-shadow: inset 0 0 0 1.5px rgba(245,230,163,.35); backface-visibility: hidden; translate: -50% -50%; transition: background .3s, color .3s, box-shadow .3s; }
.chip.hit { background: linear-gradient(90deg, var(--gold-pale), var(--gold)); color: var(--ink); box-shadow: 0 0 60px rgba(245,200,60,.9); }
.cst-cap { position: absolute; bottom: 70px; left: 0; right: 0; text-align: center; font: 500 40px var(--ui); color: var(--text-2); transition: opacity .4s; }
.fly { position: absolute; z-index: 4; display: grid; place-items: center; border-radius: 999px; background: linear-gradient(90deg, var(--gold-pale), var(--gold)); color: var(--ink); font: 700 24px var(--ui); white-space: nowrap; box-shadow: 0 0 80px rgba(245,200,60,.9); }

/* 2 · Departure board */
.dep { position: absolute; left: 80px; right: 80px; top: 190px; bottom: 60px; display: flex; flex-direction: column; gap: 18px; }
.dep-head { display: flex; align-items: center; justify-content: space-between; padding: 0 28px; height: 74px; border-radius: 16px; background: var(--red); font: 700 34px var(--display); letter-spacing: .12em; }
:lang(ar) .dep-head { letter-spacing: 0; }
.dep-head .clock { font: 700 34px var(--mono); letter-spacing: .05em; }
.cols { display: grid; grid-template-columns: 140px 1fr 280px 300px; gap: 26px; padding: 0 28px; font: 600 24px var(--ui); letter-spacing: .14em; color: var(--text-2); }
:lang(ar) .cols { letter-spacing: 0; }
.rowx { display: grid; grid-template-columns: 140px 1fr 280px 300px; gap: 26px; align-items: center; padding: 22px 28px; border-radius: 20px; background: #0E0609; box-shadow: inset 0 0 0 2px #2B1219; transition: box-shadow .5s; }
.rowx.hot { box-shadow: inset 0 0 0 4px var(--gold), 0 0 80px rgba(230,177,3,.35); }
.cells { display: flex; gap: 6px; }
.cells:not(.nm) { direction: ltr; }
.cell { position: relative; flex: none; width: 62px; height: 112px; perspective: 400px; font: 700 66px/112px var(--mono); color: #F7EFD9; text-align: center; }
.cell.w { width: 280px; font: 700 58px/112px var(--display); }
.cell.wd { width: 300px; font: 700 40px/112px var(--display); }
.cell.sm { width: 36px; height: 62px; font: 700 40px/62px var(--mono); }
.cell.sm.w { width: 150px; font: 700 34px/62px var(--display); }
.cell.sm.wd { width: 300px; font: 700 26px/62px var(--display); }
.half { position: absolute; left: 0; right: 0; height: 50%; overflow: hidden; background: #24141A; backface-visibility: hidden; }
.half > i { display: block; height: 200%; font-style: normal; }
.half.t { top: 0; border-radius: 8px 8px 0 0; transform-origin: 50% 100%; }
.half.b { top: 50%; border-radius: 0 0 8px 8px; transform-origin: 50% 0; background: #1F1116; }
.half.b > i { transform: translateY(-50%); }
.cell::after { content: ""; position: absolute; left: 0; right: 0; top: calc(50% - 1px); height: 2px; background: #0E0609; z-index: 3; }
.ft { transform: rotateX(-90deg); z-index: 2; }
.fb { z-index: 2; }
.cell.go .ft { animation: ft .085s ease-in forwards; }
.cell.go .fb { animation: fb .085s .085s ease-out both; }
@keyframes ft { from { transform: rotateX(0); } to { transform: rotateX(-90deg); } }
@keyframes fb { from { transform: rotateX(90deg); } to { transform: rotateX(0); } }
.gold .half { color: var(--ink); background: var(--gold-pale); }
.gold .half.b { background: #E9D68C; }
.wall { display: flex; flex-direction: column; gap: 10px; }
.wall .rowx { padding: 12px 28px; }
.dep-call { text-align: center; font: 600 52px var(--ui); color: var(--gold-pale); min-height: 70px; opacity: 0; transition: opacity .4s; }
.dep-call.on { opacity: 1; }

/* 3 · From all of you to one */
.mos { position: absolute; inset: 0; }
.tile { position: absolute; perspective: 1400px; transition: left .9s cubic-bezier(.2,.8,.2,1), top .9s cubic-bezier(.2,.8,.2,1), width .9s cubic-bezier(.2,.8,.2,1), height .9s cubic-bezier(.2,.8,.2,1), opacity .6s, transform .6s; }
.tile .in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.3,.1,.2,1); }
.tile.down .in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; border-radius: 10px; backface-visibility: hidden; padding: 0 8px; text-align: center; }
.front { background: rgba(48,16,26,.85); box-shadow: inset 0 0 0 1px rgba(245,230,163,.18); color: #EADFD6; font: 600 13.5px/1.15 var(--ui); letter-spacing: -.1px; white-space: nowrap; overflow: hidden; transition: font-size .9s, background .3s, color .3s, box-shadow .3s; }
.back { transform: rotateY(180deg); background: radial-gradient(circle at 50% 40%, #3A1620, #170A0E); box-shadow: inset 0 0 0 4px var(--gold); }
.back img { width: 46%; max-width: 220px; }
.tile.lit .front { background: linear-gradient(90deg, var(--gold-pale), var(--gold)); color: var(--ink); }
.tile.dim { opacity: .07; }
.tile.out { opacity: 0; transform: translateY(60px); }
.tile.big .front { border-radius: 28px; box-shadow: inset 0 0 0 3px rgba(245,230,163,.5); background: #2A1017; color: #fff; }
.tile.win .front { border-radius: 56px; background: radial-gradient(800px 300px at 50% 0%, rgba(245,230,163,.18), transparent 70%), #1C0C11; box-shadow: 0 0 0 6px var(--gold), 0 0 120px rgba(230,177,3,.45); white-space: normal; }
.tile.win .back { border-radius: 56px; }
.mos-cap { position: absolute; bottom: 52px; left: 0; right: 0; text-align: center; font: 500 40px var(--ui); color: var(--text-2); }
.front small { display: block; font: 500 .55em var(--ui); color: var(--gold-pale); margin-top: .25em; font-variant-numeric: tabular-nums; }
.tile.lit .front small { color: var(--ink); }
.front .call { display: block; font: 600 54px var(--ui); color: #fff; margin-top: 26px; }

/* 4 · Shooting star */
.gc { position: absolute; inset: 0; }
.gc canvas { z-index: 0; }
.g-rays { position: absolute; left: 50%; top: 47%; width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px; border-radius: 50%; z-index: 1; opacity: 0; transition: opacity 1.2s;
  background: repeating-conic-gradient(from 0deg, rgba(245,210,90,.24) 0 5deg, transparent 5deg 15deg);
  -webkit-mask: radial-gradient(circle, #000 0 12%, transparent 58%); mask: radial-gradient(circle, #000 0 12%, transparent 58%); animation: gspin 50s linear infinite; }
.g-rays.on { opacity: 1; }
@keyframes gspin { to { transform: rotate(360deg); } }
.g-ring { position: absolute; left: 50%; top: 47%; width: 320px; height: 320px; margin: -160px 0 0 -160px; border-radius: 50%; z-index: 2; opacity: 0; border: 10px solid var(--gold-pale); box-shadow: 0 0 80px rgba(245,200,60,.9), inset 0 0 60px rgba(245,200,60,.6); }
.g-flash { position: absolute; inset: 0; z-index: 4; background: #FFF8E1; opacity: 0; pointer-events: none; }
.g-card { position: absolute; left: 0; right: 0; top: 240px; z-index: 3; text-align: center; opacity: 0; transition: opacity .35s; }
.g-card.on { opacity: 1; }
.g-name { display: table; margin: 22px auto 0; font: 700 190px/1.1 var(--display); color: #fff; white-space: nowrap; text-shadow: 0 0 50px rgba(245,200,60,.65), 0 4px 34px rgba(23,10,14,.9); transition: filter 1.1s cubic-bezier(.2,.7,.2,1); }
.g-name.sil { filter: brightness(0) invert(1) blur(22px); }
.g-stars { display: flex; justify-content: center; gap: 24px; margin-top: 14px; }
.g-stars i { display: block; width: 70px; height: 70px; opacity: 0; transform: scale(0); filter: drop-shadow(0 0 18px rgba(245,200,60,.9)); }
.g-stars i svg { width: 100%; height: 100%; fill: var(--gold-pale); }
.g-stars i.on { animation: gpop .55s cubic-bezier(.2,1.7,.4,1) forwards; }
@keyframes gpop { from { opacity: 0; transform: scale(0) rotate(-50deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
.g-tail { display: block; margin-top: 30px; font: 500 56px/1 var(--ui); color: var(--gold-pale); font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .6s; }
.g-call { margin-top: 22px; font: 600 54px var(--ui); opacity: 0; transition: opacity .6s .2s; }
.g-card.done .g-tail, .g-card.done .g-call { opacity: 1; }
.g-tail, .g-call { text-shadow: 0 0 22px #170A0E, 0 0 8px #170A0E, 0 2px 4px #170A0E; }
.g-cap { position: absolute; bottom: 64px; left: 0; right: 0; z-index: 3; text-align: center; font: 500 40px var(--ui); color: var(--text-2); transition: opacity .4s; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
/* 5 · Fireworks */
.fw-pill { position: absolute; z-index: 3; top: 200px; left: 0; right: 0; text-align: center; opacity: 0; transition: opacity .5s; }
.fw-meta { position: absolute; z-index: 3; top: 660px; left: 0; right: 0; text-align: center; }
.gc.won .fw-pill, .gc.won .fw-meta .g-tail, .gc.won .fw-meta .g-call { opacity: 1; }
/* 6 · Rev to reveal */
.rev { position: absolute; inset: 0; transform-origin: 50% 55%; transition: transform .9s cubic-bezier(.5,0,.2,1), opacity .7s; }
.rev.gone { transform: scale(.55); opacity: 0; }
.rev svg { position: absolute; left: 0; top: 0; }
.ro { position: absolute; left: 50%; top: 715px; width: 640px; height: 124px; margin-left: -320px; border-radius: 20px; display: grid; place-items: center; overflow: hidden; white-space: nowrap;
  background: #0B0306; box-shadow: inset 0 0 0 3px rgba(245,230,163,.4); font: 700 66px var(--display); color: #F7EFD9; transition: background .2s, color .2s; }
.ro.lock { background: linear-gradient(90deg, var(--gold-pale), var(--gold)); color: var(--ink); box-shadow: 0 0 60px rgba(245,200,60,.8); }
.sl { fill: #2A1017; stroke: #5A2A33; stroke-width: 3; }
.sl.on1 { fill: #E6B103; filter: drop-shadow(0 0 14px #E6B103); }
.sl.on2 { fill: #FF8300; filter: drop-shadow(0 0 14px #FF8300); }
.sl.on3 { fill: #FF2D45; filter: drop-shadow(0 0 16px #FF2D45); }
.blink .sl { animation: slb .16s steps(2) infinite; }
@keyframes slb { 50% { opacity: .25; } }
.beam { position: absolute; bottom: 0; width: 900px; height: 1300px; z-index: 3; opacity: 0; pointer-events: none; transform-origin: 50% 100%; mix-blend-mode: screen;
  clip-path: polygon(50% 100%, 0 0, 100% 0); background: linear-gradient(to top, rgba(255,246,220,.85), rgba(255,246,220,0)); }
.beam.l { left: -300px; } .beam.r { right: -300px; }
/* 8 · Spotlight */
.arena { position: absolute; inset: 0; perspective: 1300px; perspective-origin: 50% 18%; overflow: hidden; }
.seats { position: absolute; left: 50%; top: 60%; width: 2584px; height: 1480px; transform: translate(-50%, -50%) rotateX(56deg); }
.seat { position: absolute; width: 70px; height: 56px; padding: 2px; border-radius: 8px; display: grid; place-items: center; overflow: hidden; text-align: center;
  background: #3A1520; color: #F1E4DA; font: 600 13px/1.1 var(--ui); transition: background .4s, color .4s, box-shadow .4s; }
.seat.hit { background: linear-gradient(90deg, var(--gold-pale), var(--gold)); color: var(--ink); box-shadow: 0 0 40px rgba(245,200,60,.95); }
@media (prefers-reduced-motion: reduce) { .g-name, .g-stars i, .tile, .tile .in, .sph, #win, .cell.go .ft, .cell.go .fb { transition: none !important; animation: none !important; } }
</style>

<div class="ctl">
  <div class="seg" role="group" aria-label="Direction" id="dirs"></div>
  <div class="seg" role="group" aria-label="Language" id="langs"></div>

  <button class="ghost" id="reset" type="button">Reset</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="draw.js"></script>
<script>
const STAR = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;
const F = [["أحمد","Ahmed"],["محمد","Mohammed"],["خالد","Khalid"],["عبد الله","Abdullah"],["سعيد","Saeed"],["ياسر","Yasser"],["فهد","Fahad"],["ماجد","Majed"],["عمر","Omar"],["يوسف","Yousef"],["إبراهيم","Ibrahim"],["علي","Ali"],["حسن","Hassan"],["طارق","Tariq"],["ناصر","Nasser"],["سلطان","Sultan"],["وليد","Waleed"],["مصطفى","Mostafa"],["سامي","Sami"],["رامي","Rami"]];
const L = [["الغامدي","Al Ghamdi"],["القحطاني","Al Qahtani"],["الحربي","Al Harbi"],["الزهراني","Al Zahrani"],["الشهري","Al Shehri"],["العتيبي","Al Otaibi"],["المالكي","Al Malki"],["منصور","Mansour"],["السيد","El Sayed"],["حسين","Hussein"],["صالح","Saleh"],["المطيري","Al Mutairi"],["الدوسري","Al Dosari"],["اليامي","Al Yami"],["عثمان","Othman"]];
const ENTRIES = Array.from({ length: 1000 }, (_, i) => { const f = F[i % F.length], l = L[(i * 7 + (i >> 2)) % L.length]; return { id: i, ar: f[0] + " " + l[0], en: f[1] + " " + l[1], phone: "5" + String((i * 48271 + 10000019) % 100000000).padStart(8, "0") }; });

const T = {
  en: { inDraw: "in the draw", winner: "Winner", call: "Please come to the stage", cstIdle: "Every name in the room is in this sphere.", cstSpin: "Drawing a name…",

  { name: "1 · Constellation", hint: "Every name orbits in a sphere. It speeds up, slows down, the hall turns gold, and one name flies forward." },

];
const $ = id => document.getElementById(id), stage = $("stage"), scene = $("scene");
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* 1 · Constellation: name chips on a Fibonacci sphere, rotated with CSS 3D. */
const Constellation = (() => {

  function mount() {
    const names = shuffle(pool().slice()).slice(0, N);
    scene.innerHTML = `<div class="cst"><div class="sph" id="sph"></div></div><div class="cst-cap" id="cap">${t().cstIdle}</div>`;
    sph = $("sph"); cap = $("cap");
    chips = names.map((e, i) => {
      const y = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - y * y), th = i * Math.PI * (3 - Math.sqrt(5));
      const yaw = Math.atan2(Math.cos(th) * r, Math.sin(th) * r) * 180 / Math.PI, pitch = Math.asin(y) * 180 / Math.PI;
      const el = document.createElement("span"); el.className = "chip"; el.textContent = nm(e);
      el.style.transform = `rotateY(${yaw}deg) rotateX(${pitch}deg) translateZ(${R}px)`;

      let x = Math.cos(p) * Math.sin(w), y = -Math.sin(p), z = Math.cos(p) * Math.cos(w);
      const x1 = x * Math.cos(b) + z * Math.sin(b), z1 = -x * Math.sin(b) + z * Math.cos(b);
      const z2 = y * Math.sin(a) + z1 * Math.cos(a);

  }

    const e = draw(); tally(); cap.textContent = t().cstSpin;
    const p = pool(), shuffler = setInterval(() => { for (let i = 0; i < 8; i++) pick(chips).el.textContent = nm(pick(p)); }, 90);
    await ramp(520, 1400); await wait(2200);
    const slow = ramp(4, 4200); await wait(2600); stage.classList.add("tell"); clearInterval(shuffler); await slow;
    speed = 0; const c = front(); c.el.textContent = nm(e); c.el.classList.add("hit"); cap.style.opacity = 0;
    await wait(900);

    Object.assign(fl.style, { left: b.x + "px", top: b.y + "px", width: b.w + "px", height: b.h + "px" }); stage.appendChild(fl);
    sph.classList.add("gone");
    const anim = fl.animate([{ left: b.x + "px", top: b.y + "px", width: b.w + "px", height: b.h + "px", fontSize: "24px", opacity: 1 },
      { left: "210px", top: "330px", width: "1500px", height: "480px", fontSize: "150px", opacity: 1, offset: .85 },
      { left: "210px", top: "330px", width: "1500px", height: "480px", fontSize: "150px", opacity: 0 }], { duration: calm ? 1 : 1100, easing: "cubic-bezier(.3,0,.1,1)", fill: "forwards" });

  const latin = () => S.lang === "en";
  const nameParts = e => latin() ? nm(e).toUpperCase().padEnd(NL).slice(0, NL).split("") : (w => [w[0] || " ", w[1] || " ", w[2] || " "])(nm(e).split(" "));

    row = $("row").firstElementChild; wall = $("wall"); call = $("dcall"); drawNo = S.drawn.length;
    set(row.querySelector(".st .cell"), T_.waiting);
    const tick = () => { const d = new Date(); const c = $("clock"); if (c) c.textContent = d.toTimeString().slice(0, 5); };

/* 3 · From all of you to one: a mosaic of every name, narrowed in host-paced stages. */
const Mosaic = (() => {
  let tiles = [], step = 0, winner, ten, three, cap;
  const LABELS = ["Start the draw", "Bring 10 forward", "Narrow to 3", "Turn face down", "Reveal the winner", "Draw the next name"];
  const place = (tl, x, y, w, h, fs) => { Object.assign(tl.el.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" }); if (fs) tl.front.style.fontSize = fs + "px"; };

    const list = pool(), W = 1800, H = 760, x0 = 60, y0 = 180, gx = list.length > 400 ? 4 : 8, gy = gx, cols = Math.ceil(Math.sqrt(list.length * W / H / 2.4));
    const rows = Math.ceil(list.length / cols), tw = (W - gx * (cols - 1)) / cols, th = Math.min(52, (H - gy * (rows - 1)) / rows), fs = Math.min(13.5, th * .6, tw / 6.2);
    scene.innerHTML = `<div class="mos" id="mos"></div><div class="mos-cap" id="mcap">${t().mosCaps[0]}</div>`;
    const m = $("mos"); cap = $("mcap");
    tiles = list.map((e, i) => {
      const el = document.createElement("div"); el.className = "tile";
      el.innerHTML = `<div class="in"><div class="face front">${nm(e)}</div><div class="face back"><img src="assets/logo.png" alt=""></div></div>`;
      m.appendChild(el); const tl = { e, el, front: el.querySelector(".front") };
      place(tl, x0 + (i % cols) * (tw + gx), y0 + Math.floor(i / cols) * (th + gy), tw, th, fs); return tl;
    });
    step = 0;
  }
  async function run() {
    const T_ = t();
    if (step === 5) { mount(); await wait(60); }
    if (step === 0) {
      winner = draw(); tally();
      const w = tiles.find(x => x.e.id === winner.id);
      ten = shuffle(tiles.filter(x => x !== w)).slice(0, 9).concat(w); shuffle(ten);
      const t0 = performance.now();
      while (performance.now() - t0 < (calm ? 0 : 2600)) { const lit = Array.from({ length: Math.max(18, tiles.length / 12 | 0) }, () => pick(tiles)); lit.forEach(x => x.el.classList.add("lit")); await wait(110); lit.forEach(x => x.el.classList.remove("lit")); }
      tiles.forEach(x => x.el.classList.toggle("dim", !ten.includes(x))); ten.forEach(x => x.el.classList.add("lit"));
      cap.textContent = T_.mosCaps[1];
    } else if (step === 1) {
      tiles.forEach(x => { if (!ten.includes(x)) x.el.classList.add("out"); });
      ten.forEach((x, i) => { x.el.classList.remove("lit"); x.el.classList.add("big"); x.front.innerHTML = `${nm(x.e)}<small>#${entryNo(x.e)}</small>`;
        place(x, 120 + (i % 5) * 344, 300 + Math.floor(i / 5) * 230, 320, 200, 40); });
    } else if (step === 2) {
      three = ten.filter(x => x.e.id === winner.id).concat(shuffle(ten.filter(x => x.e.id !== winner.id)).slice(0, 2)); shuffle(three);
      ten.forEach(x => { if (!three.includes(x)) x.el.classList.add("out"); });
      three.forEach((x, i) => place(x, 150 + i * 560, 330, 500, 320, 58));
      cap.textContent = T_.mosCaps[2];
    } else if (step === 3) {
      three.forEach(x => x.el.classList.add("down")); await wait(900);
      for (let r = 0; r < 3; r++) { shuffle(three); three.forEach((x, i) => place(x, 150 + i * 560, 330, 500, 320)); await wait(950); }

    } else if (step === 4) {

      w.el.classList.add("win"); w.front.style.whiteSpace = "normal";

  const ang = r => -135 + Math.min(8200, r) / 8000 * 270;
  const pol = (r, a) => [CX + r * Math.sin(a * Math.PI / 180), CY - r * Math.cos(a * Math.PI / 180)];
  const arc = (r, a0, a1) => { const [x0, y0] = pol(r, a0), [x1, y1] = pol(r, a1); return `M${x0} ${y0} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`; };
  function gauge() {
    let ticks = "";
    for (let k = 0; k <= 16; k++) {
      const a = ang(k * 500), major = k % 2 === 0, [x0, y0] = pol(RR - (major ? 46 : 26), a), [x1, y1] = pol(RR - 6, a);
      ticks += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${k >= 13 ? "#FF4D5E" : "#F5E6A3"}" stroke-width="${major ? 7 : 4}" stroke-linecap="round"/>`;
      if (major) { const [lx, ly] = pol(RR - 92, a); ticks += `<text x="${lx}" y="${ly}" fill="#F5E6A3" font-family="Space Grotesk" font-weight="700" font-size="46" text-anchor="middle" dominant-baseline="central">${k / 2}</text>`; }
    }
    const lights = Array.from({ length: 5 }, (_, i) => `<circle class="sl" cx="${CX - 200 + i * 100}" cy="150" r="30"/>`).join("");
    return `<svg width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" id="revsvg">
      <defs><radialGradient id="gface"><stop offset="0" stop-color="#2A0E16"/><stop offset="1" stop-color="#12050A"/></radialGradient>
      <linearGradient id="grim" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F5E6A3"/><stop offset="1" stop-color="#9A6A00"/></linearGradient></defs>
      ${lights}<circle cx="${CX}" cy="${CY}" r="${RR + 26}" fill="url(#gface)" stroke="url(#grim)" stroke-width="14"/>
      <path d="${arc(RR - 14, ang(6500), ang(8000))}" stroke="#CE0E2D" stroke-width="22" fill="none"/>
      <path id="rpmArc" d="" stroke="#E6B103" stroke-width="10" fill="none" opacity=".75" stroke-linecap="round"/>
      ${ticks}<text x="${CX}" y="${CY - 125}" fill="#E2D3D6" font-family="Inter" font-weight="600" font-size="26" text-anchor="middle">×1000 RPM</text>
      <g id="needle" style="transform-origin:${CX}px ${CY}px"><path d="M${CX - 10} ${CY + 30} L${CX} ${CY - RR + 40} L${CX + 10} ${CY + 30} Z" fill="#FF4D5E"/></g>
      <circle cx="${CX}" cy="${CY}" r="34" fill="#170A0E" stroke="url(#grim)" stroke-width="6"/></svg>`;
  }
  function mount() {
    scene.innerHTML = `<div class="rev" id="rev">${gauge()}<div class="ro" id="ro">${t().revBrand}</div></div><div class="beam l" id="bl"></div><div class="beam r" id="br"></div><div class="g-cap" id="rcap">${t().revIdle}</div>`;
    el = { wrap: $("rev"), svg: $("revsvg"), ro: $("ro"), needle: $("needle"), arcP: $("rpmArc"), lights: [...document.querySelectorAll(".sl")], bl: $("bl"), br: $("br"), cap: $("rcap") };
    rpm = 0; acc = 0; locked = false; state = "idle"; last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
  }
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!locked && rpm > 200 && (acc += rpm * dt) > 650) { acc = 0; el.ro.textContent = nm(pick(names)); }
    el.needle.style.transform = `rotate(${ang(rpm)}deg)`;
    el.arcP.setAttribute("d", rpm > 80 ? arc(RR - 14, -135, ang(rpm)) : "");
    el.lights.forEach((c, i) => c.setAttribute("class", "sl" + (rpm > 5200 + i * 520 ? " on" + (i < 2 ? 1 : i < 4 ? 2 : 3) : "")));
    if (osc) { const f = 26 + rpm / 60 * 1.15; osc.frequency.setTargetAtTime(f, AC.currentTime, .03); osc2.frequency.setTargetAtTime(f * .503, AC.currentTime, .03); filt.frequency.setTargetAtTime(350 + rpm / 7, AC.currentTime, .05); }

  function engineOn() {

    try { AC ||= new AudioContext(); osc = AC.createOscillator(); osc2 = AC.createOscillator(); filt = AC.createBiquadFilter(); gn = AC.createGain();
      osc.type = "sawtooth"; osc2.type = "square"; filt.type = "lowpass"; gn.gain.value = 0; osc.connect(filt); osc2.connect(filt); filt.connect(gn).connect(AC.destination);

  const rpmTo = (to, ms, f = ease) => { const from = rpm; return tweenP(ms, p => { rpm = from + (to - from) * f(p); }); };
  async function run() {
    if (state === "won") { hideWinner(); el.wrap.classList.remove("gone"); el.svg.classList.remove("blink"); el.ro.classList.remove("lock"); el.ro.textContent = t().revBrand; rpm = 0; locked = false; el.cap.style.opacity = 1; await wait(600); }
    const e = draw(); tally(); state = "busy"; names = pool(); el.cap.style.opacity = 0;
    if (!calm) {
      engineOn();
      await rpmTo(1000, 500); await wait(300);
      await rpmTo(3800, 380); await rpmTo(1200, 520); await wait(200);
      await rpmTo(5400, 420); await rpmTo(1500, 560); await wait(300);
      await rpmTo(7700, 2800, p => p * p);
    }
    locked = true; el.ro.textContent = nm(e); el.ro.classList.add("lock"); el.svg.classList.add("blink");
    await wait(800);
    engineOff(); tone(240, 1.1, "sawtooth", .06, 0, 50); noise(.5, 260); tone(60, 1.4, "sine", .5);
    stage.classList.add("tell");
    [[el.bl, 38, 8], [el.br, -38, -8]].forEach(([b, a0, a1]) => b.animate([{ opacity: 0, transform: `rotate(${a0}deg)` }, { opacity: .95, transform: `rotate(${(a0 + a1) / 2}deg)`, offset: .4 }, { opacity: 0, transform: `rotate(${a1}deg)` }], { duration: calm ? 1 : 1500, easing: "ease-out" }));
    el.wrap.classList.add("gone"); await wait(550); stage.classList.remove("tell");
    showWinner(e); state = "won";
  }
  return { mount, run, label: () => state === "won" ? "Draw the next name" : "Draw a name", stop: () => { cancelAnimationFrame(raf); engineOff(); } };
})();

/* 7 · Gift box (3D): a red-and-gold box shakes three times, light leaks from the lid, then it bursts open into a pillar of light. */
const Gift = !can3d ? null : (() => {
  const P = 900;
  let R, sc, cam, raf, last, el = {}, state = "idle", grp, pivot, seam, pillar, inner, pPts, pPos, pCol, pVel, pLife, pi = 0, shakeAmp = 0, spinOn = true, camZ = 38, lookY = 6, lookNow = 6;
  const emit = (x, y, z, vx, vy, vz, life) => { const k = pi * 3; pPos.set([x, y, z], k); pVel.set([vx, vy, vz], k); pLife[pi] = life; pi = (pi + 1) % P; };
  const phong = (color, shininess = 60) => new THREE.MeshPhongMaterial({ color, shininess, specular: 0x5a3a22 });
  const additive = o => Object.assign({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }, o);
  function pillarTex() { const c = document.createElement("canvas"); c.width = 4; c.height = 256; const g = c.getContext("2d"), gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, "rgba(255,230,150,0)"); gr.addColorStop(1, "rgba(255,240,190,1)"); g.fillStyle = gr; g.fillRect(0, 0, 4, 256); return new THREE.CanvasTexture(c); }
  function mount() {
    scene.innerHTML = gcHTML('<div id="g3b" style="position:absolute;inset:0"></div>', t().giftIdle); el = gcEls();
    R = new THREE.WebGLRenderer({ antialias: true, alpha: true }); R.setPixelRatio(1); R.setSize(1920, 1080, false);
    Object.assign(R.domElement.style, { position: "absolute", inset: "0", width: "100%", height: "100%", zIndex: "0" }); $("g3b").appendChild(R.domElement);
    sc = new THREE.Scene(); cam = new THREE.PerspectiveCamera(42, 16 / 9, .1, 500); camZ = 38; cam.position.set(0, 11, camZ);
    const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshPhongMaterial({ color: 0x1a070d, shininess: 20 })); floor.rotation.x = -Math.PI / 2;
    const ring = new THREE.Mesh(new THREE.RingGeometry(9, 9.6, 64), new THREE.MeshBasicMaterial(additive({ color: 0xE6B103, opacity: .45 }))); ring.rotation.x = -Math.PI / 2; ring.position.y = .02;
    grp = new THREE.Group(); sc.add(floor, ring, grp);
    const red = phong(0x8E0B22, 50), gold = phong(0xC9971A, 120);
    const mk = (w, h, d, m, x, y, z) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); return o; };
    grp.add(mk(10, 8, 10, red, 0, 4, 0), mk(1.6, 8.04, 10.04, gold, 0, 4, 0), mk(10.04, 8.04, 1.6, gold, 0, 4, 0));
    pivot = new THREE.Group(); pivot.position.set(0, 8, -5.4); grp.add(pivot);
    const bowA = new THREE.Mesh(new THREE.TorusGeometry(1.7, .5, 14, 40), gold); bowA.position.set(-1.5, 2.6, 5.4); bowA.rotation.z = Math.PI / 4;
    const bowB = bowA.clone(); bowB.position.x = 1.5; bowB.rotation.z = -Math.PI / 4;
    pivot.add(mk(10.8, 1.8, 10.8, red, 0, .9, 5.4), mk(1.7, 1.84, 10.84, gold, 0, .9, 5.4), mk(10.84, 1.84, 1.7, gold, 0, .9, 5.4), bowA, bowB);
    seam = mk(10.4, .3, 10.4, new THREE.MeshBasicMaterial(additive({ color: 0xFFE08A, opacity: 0 })), 0, 8.05, 0); grp.add(seam);
    pillar = new THREE.Mesh(new THREE.CylinderGeometry(4.6, 3.6, 70, 40, 1, true), new THREE.MeshBasicMaterial(additive({ map: pillarTex(), color: 0xFFC24A, opacity: 0, side: THREE.DoubleSide })));
    pillar.position.y = 43; inner = new THREE.PointLight(0xFFD27A, 0, 60); inner.position.set(0, 9, 0);
    const sp = new THREE.SpotLight(0xfff1d6, 1.5, 140, .5, .5); sp.position.set(8, 40, 26); sp.target = grp;
    const fill = new THREE.DirectionalLight(0xffd9a0, .45); fill.position.set(-20, 10, 10);
    pPos = new Float32Array(P * 3); pCol = new Float32Array(P * 3); pVel = new Float32Array(P * 3); pLife = new Float32Array(P);
    const pg = new THREE.BufferGeometry(); pg.setAttribute("position", new THREE.BufferAttribute(pPos, 3)); pg.setAttribute("color", new THREE.BufferAttribute(pCol, 3));
    pPts = new THREE.Points(pg, new THREE.PointsMaterial(additive({ map: glowTex(), size: .9, vertexColors: true })));
    sc.add(pillar, inner, sp, fill, pPts, new THREE.AmbientLight(0xffe2c0, .35));
    state = "idle"; spinOn = true; shakeAmp = 0; lookY = lookNow = 6; last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
  }
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000), t = now / 1000; last = now;
    if (spinOn) { grp.rotation.y += dt * .35; grp.position.y = Math.sin(t * 1.6) * .25; }
    if (shakeAmp) { grp.rotation.z = Math.sin(t * 55) * shakeAmp; grp.position.x = Math.sin(t * 47) * shakeAmp * 6; } else { grp.rotation.z *= .8; grp.position.x *= .8; }
    for (let i = 0; i < P; i++) if (pLife[i] > 0) {
      const k = i * 3; pLife[i] -= dt; const f = Math.max(0, Math.min(1, pLife[i]));
      pVel[k + 1] -= 14 * dt; for (let j = 0; j < 3; j++) pPos[k + j] += pVel[k + j] * dt;
      pCol[k] = f; pCol[k + 1] = f * .83; pCol[k + 2] = f * .45;
    }
    pPts.geometry.attributes.position.needsUpdate = true; pPts.geometry.attributes.color.needsUpdate = true;
    cam.position.z += (camZ - cam.position.z) * .05; lookNow += (lookY - lookNow) * .05; cam.lookAt(0, lookNow, 0);

  }
  const leak = n => { for (let i = 0; i < n; i++) { const side = Math.random() < .5, s = Math.random() < .5 ? -5.2 : 5.2, u = (Math.random() - .5) * 10.4;
    emit(side ? s : u, 8.1, side ? u : s, (Math.random() - .5) * 2, 4 + Math.random() * 5, (Math.random() - .5) * 2, .7 + Math.random() * .5); } };
  const fountain = n => { for (let i = 0; i < n; i++) emit((Math.random() - .5) * 6, 8.5, (Math.random() - .5) * 6, (Math.random() - .5) * 12, 18 + Math.random() * 18, (Math.random() - .5) * 12, 1.4 + Math.random() * .9); };
  async function run() {
    if (state === "won") {

    }
    const e = draw(); tally(); state = "busy"; gcPrep(el, e); el.gcap.textContent = t().giftWait;
    if (!calm) {
      spinOn = false; const r0 = grp.rotation.y, r1 = (Math.floor(r0 / (Math.PI * 2)) + 1) * Math.PI * 2;
      await tweenP(900, p => { grp.rotation.y = r0 + (r1 - r0) * ease(p); });
      for (const [i, a] of [.025, .05, .085].entries()) {

        seam.material.opacity = .35 + i * .3; inner.intensity = .4 + i * .5; leak(30 + i * 40);

      }
      el.gcap.style.opacity = 0;
      tone(60, 1.6, "sine", .55); noise(.5, 260); tone(880, 1.2, "triangle", .08);
      el.gflash.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 900, easing: "ease-out" }); fountain(380);
      tweenP(520, p => { const q = ease(p); pivot.rotation.x = -2.2 * q; pivot.position.y = 8 + 3 * q; pivot.position.z = -5.4 - 2 * q; });
      tweenP(700, p => { pillar.material.opacity = .85 * p; inner.intensity = 1.9 + 2 * p; seam.material.opacity = 1 - p; });
      camZ = 30; lookY = 14; await wait(650);
      tweenP(900, p => { pillar.material.opacity = .85 - .5 * p; });
    }
    await gcReveal(el); state = "won";
  }
  return { mount, run, label: () => state === "won" ? "Draw the next name" : "Draw a name",
    stop: () => { cancelAnimationFrame(raf); if (R) { R.dispose(); R.forceContextLoss(); R = null; } } };
})();

/* 8 · Spotlight: names fill the seats of an arena; three spotlights sweep to a drumroll and close in on one seat. */
const Spotlight = (() => {
  const COLS = 34, ROWS = 20, TW = 70, TH = 56, GX = 6, GY = 18;
  let cx, raf, last, el = {}, seats = [], L = [], tScale = 1, tt = 0, dark = .72, state = "idle", winSeat, conv = null;
  function mount() {
    const list = shuffle(pool().slice()).slice(0, COLS * ROWS);
    scene.innerHTML = `<div class="arena"><div class="seats" id="seats"></div></div><canvas id="spot" width="1920" height="1080" style="z-index:2"></canvas><div class="g-cap" id="spcap" style="z-index:3">${t().spotIdle}</div>`;
    const host = $("seats"); el = { cap: $("spcap") }; cx = $("spot").getContext("2d");
    seats = list.map((e, i) => { const d = document.createElement("div"); d.className = "seat"; d.textContent = nm(e);
      d.style.left = (i % COLS) * (TW + GX) + "px"; d.style.top = Math.floor(i / COLS) * (TH + GY) + "px"; host.appendChild(d); return { e, d }; });
    L = [0, 1, 2].map(i => ({ sx: 360 + i * 600, ph: i * 2.1, x: 960, y: 640, r: 175 }));
    tScale = 1; dark = .72; conv = null; state = "idle"; last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
  }
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; tt += dt * tScale;
    if (conv) { const q = ease(Math.min(1, (now - conv.t0) / conv.ms)); L.forEach((l, i) => { l.x = conv.from[i][0] + (conv.tx - conv.from[i][0]) * q; l.y = conv.from[i][1] + (conv.ty - conv.from[i][1]) * q; l.r = 175 - 70 * q; }); }
    else L.forEach((l, i) => { l.x = 960 + Math.sin(tt * (.5 + i * .17) + l.ph) * 620; l.y = 640 + Math.sin(tt * (.7 + i * .11) + l.ph * 1.3) * 220; });
    cx.globalCompositeOperation = "source-over"; cx.clearRect(0, 0, 1920, 1080); cx.fillStyle = `rgba(6,1,4,${dark})`; cx.fillRect(0, 0, 1920, 1080);
    cx.globalCompositeOperation = "destination-out";
    L.forEach(l => { const g = cx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r); g.addColorStop(0, "rgba(0,0,0,1)"); g.addColorStop(.65, "rgba(0,0,0,.85)"); g.addColorStop(1, "rgba(0,0,0,0)");
      cx.fillStyle = g; cx.beginPath(); cx.ellipse(l.x, l.y, l.r, l.r * .7, 0, 0, 7); cx.fill(); });
    cx.globalCompositeOperation = "lighter";
    L.forEach(l => {
      const g = cx.createLinearGradient(l.sx, -60, l.x, l.y); g.addColorStop(0, "rgba(255,240,205,.26)"); g.addColorStop(1, "rgba(255,240,205,.05)");
      cx.fillStyle = g; cx.beginPath(); cx.moveTo(l.sx - 30, -60); cx.lineTo(l.sx + 30, -60); cx.lineTo(l.x + l.r * .9, l.y); cx.lineTo(l.x - l.r * .9, l.y); cx.closePath(); cx.fill();
      const h = cx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r); h.addColorStop(0, "rgba(255,225,150,.2)"); h.addColorStop(1, "rgba(255,225,150,0)");
      cx.fillStyle = h; cx.beginPath(); cx.ellipse(l.x, l.y, l.r, l.r * .7, 0, 0, 7); cx.fill();
    });
    raf = requestAnimationFrame(frame);
  }
  async function run() {
    if (state === "won") { hideWinner(); winSeat.d.classList.remove("hit"); dark = .72; conv = null; L.forEach(l => { l.r = 175; }); tScale = 1; el.cap.style.opacity = 1; await wait(500); }
    const e = draw(); tally(); state = "busy"; el.cap.style.opacity = 0;
    winSeat = seats[(12 + Math.floor(Math.random() * 5)) * COLS + 8 + Math.floor(Math.random() * 18)]; winSeat.e = e; winSeat.d.textContent = nm(e);
    if (!calm) {
      drumroll(4.4);
      await tweenP(1200, p => { tScale = 1 + 3.5 * p; }); await wait(1500);
      const b = box(winSeat.d);
      conv = { t0: performance.now(), ms: 1500, from: L.map(l => [l.x, l.y]), tx: b.x + b.w / 2, ty: b.y + b.h / 2 }; await wait(1500);
      noise(.6, 420); tone(65, 1.6, "sine", .55);
      winSeat.d.classList.add("hit"); await tweenP(500, p => { dark = .72 + .2 * p; }); stage.classList.add("tell");
      await wait(800);
      await flyToCard(winSeat.d, e, 13); stage.classList.remove("tell");
    } else showWinner(e);
    state = "won";
  }
  return { mount, run, label: () => state === "won" ? "Draw the next name" : "Draw a name", stop: () => cancelAnimationFrame(raf) };
})();

const MODS = [Constellation, Board, Mosaic, Gacha3D || Gacha, Fireworks, Rev, Gift || Gacha, Spotlight];

function ui() {
  $("dirs").innerHTML = DIRS.map((d, i) => `<button type="button" data-i="${i}" aria-pressed="${i === S.dir}">${d.name}</button>`).join("");
  $("langs").innerHTML = [["ar", "العربية"], ["en", "English"]].map(([k, v]) => `<button type="button" data-l="${k}" aria-pressed="${k === S.lang}" lang="${k}">${v}</button>`).join("");
  $("hint").textContent = DIRS[S.dir].hint + " Space runs the next step.";
  $("go").textContent = MODS[S.dir].label(); $("go").disabled = S.busy;
  $("snd").textContent = "Sound: " + (S.sound ? "on" : "off");
  try { history.replaceState(null, "", `#d${S.dir + 1}-${S.lang}`); } catch {}
}
function mount() {
  MODS.forEach(m => m.stop()); hideWinner(); stage.classList.remove("tell"); document.querySelectorAll(".fly").forEach(x => x.remove());
  const r = document.documentElement; r.lang = S.lang; stage.dir = S.lang === "ar" ? "rtl" : "ltr";
  S.busy = false; tally(); MODS[S.dir].mount(); $("snd").hidden = false; ui();
}
async function go() {
  if (S.busy) return; if (!pool().length) S.drawn = [];
  S.busy = true; ui();
  try { await MODS[S.dir].run(); } finally { S.busy = false; ui(); }
}
$("dirs").addEventListener("click", e => { const b = e.target.closest("button"); if (b && !S.busy) { S.dir = +b.dataset.i; mount(); } });
$("langs").addEventListener("click", e => { const b = e.target.closest("button"); if (b && !S.busy) { S.lang = b.dataset.l; mount(); } });
$("go").addEventListener("click", go);
$("reset").addEventListener("click", () => { if (S.busy) return; S.drawn = []; mount(); });
$("snd").addEventListener("click", () => { S.sound = !S.sound; ui(); });
addEventListener("keydown", e => { if (e.code === "Space" && !e.target.closest(".ctl")) { e.preventDefault(); go(); } });

// #d2-en opens a direction and language; #d3-en-4 also runs 4 steps (used for previews).
const m = location.hash.match(/^#d([1-8])-(ar|en)(?:-(\d))?$/);
if (m) { S.dir = m[1] - 1; S.lang = m[2]; }
fit(); mount();
if (m && m[3]) (async () => { await wait(800); for (let i = 0; i < +m[3]; i++) { await go(); await wait(1200); } })();
</script>
